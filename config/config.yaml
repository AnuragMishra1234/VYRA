# VYRA Experiment and System Configuration
# Note: Initial configuration defaults subject to empirical validation.

dataset:
  name: "IO-VNBD"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  metadata_dir: "data/metadata"
  sampling_rate_hz: 10.0  # Nominal rate from IO-VNBD documentation
  target_coordinate_frame: "ENU"  # Local East-North-Up tangent plane
  file_pattern: "*.csv"

preprocessing:
  history_window_steps: 50       # 5.0 seconds at 10 Hz
  stride_steps: 1                # Causal step increment
  remove_exact_duplicates: true
  enforce_monotonic_timestamps: true
  filter_impossible_geodetic: true
  min_satellites_valid: 0        # Keep degraded GNSS for scientific observation
  preserve_degradation: true     # Never drop records merely because GNSS is degraded

splits:
  strategy: "trajectory"         # Trajectory-level splitting to prevent leakage
  train_ratio: 0.60
  val_ratio: 0.20
  test_ratio: 0.20
  random_seed: 42

prediction:
  horizons_seconds:
    - 1.0
    - 3.0
    - 5.0
    - 10.0
  features:
    - "hdop"
    - "vdop"
    - "satellites_available"
    - "speed_mps"
    - "acc_norm"
    - "gyro_norm"
  model_type: "logistic_regression"

forecasting:
  candidate_actions:
    - "GNSS"
    - "HYBRID"
    - "DR"
  horizons_seconds:
    - 1.0
    - 3.0
    - 5.0
    - 10.0
  error_thresholds_meters:
    - 5.0
    - 10.0
    - 20.0
  target_metric: "expected_position_error"

simulation:
  outage_durations_seconds:
    - 2.0
    - 5.0
    - 10.0
    - 20.0
    - 30.0
  degradation_levels:
    - "mild"
    - "moderate"
    - "severe"
    - "outage"
  simulate_sensor_dropout: false

navigation:
  dead_reckoning:
    integration_method: "strapdown_euler"
  fusion:
    filter_type: "ekf"
    state_dimension: 6  # East, North position, velocity, yaw, gyro bias (6-state horizontal EKF)

policy:
  baseline_type: "reactive"
  dwell_time_seconds: 3.0
  hysteresis_margin_m: 1.5
  switching_penalty_weight: 1.0
  acceptable_error_bound_meters: 5.0

evaluation:
  metrics:
    - "ate"
    - "rte"
    - "rmse"
    - "max_error"
    - "final_drift"
    - "handover_count"
    - "warning_lead_time"
  significance_level: 0.05

random_seed: 42
